[project]
name = "rockscissorspaperbot"
version = "0.9.0"
description = "super description"
requires-python = "~=3.13.4"
dependencies = [
    'asyncio~=3.4.3',
    'aiohttp>=3.11.18',
    'aiohttp-socks~=0.10.1',
    'aiogram~=3.20.0.post0',
    'environs~=14.2.0',
    'asyncpg~=0.30.0',
    'redis~=6.2.0',
    'SQLAlchemy~=2.0.40',
    'alembic~=1.16.1',
    "pydantic==2.11.5",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest~=8.4.0",
    "pylint~=3.3.7"
]

[tool.uv]
managed = true
default-groups = ['dev']
